name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest, grammar, and extension.js
        run: npm run check
      - name: Package .vsix
        run: npm run package
      - name: Verify .vsix produced
        run: ls -lh *.vsix
